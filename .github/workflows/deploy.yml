name: Deploy

# The only path to production (§16). Nothing deploys from a laptop: `wrangler
# deploy` and `d1 migrations apply --remote` run here and nowhere else.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once: migrations are not reentrant.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Migrate D1 and deploy the Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm install --no-audit --no-fund

      # A broken build must never reach the remote D1, so the gate runs before
      # the migration, not after.
      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      - run: npm run content:validate

      - run: npm run build

      # Forward-only migrations. Drizzle-generated SQL in drizzle/, applied by
      # wrangler, which tracks what has already run in d1_migrations.
      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply devopsdojo-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Content is upserted after the code is live, because a new card may rely
      # on a renderer that only exists in the new build (D12). Skipped while
      # content/ is empty: content:sync lands in Phase 2.
      - name: Sync content into D1
        if: hashFiles('content/decks/**/*.json') != ''
        run: npm run content:sync -- --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Runtime secrets are set once with `wrangler secret put` and are not
      # touched here: a workflow that could rewrite them would also be a way to
      # read them out of a PR.
      - name: Smoke check
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            status=$(curl -s -o /dev/null -w '%{http_code}' https://devopsdojo.valegboth.win/ || true)
            if [ "$status" = "200" ]; then
              echo "up (HTTP $status)"
              exit 0
            fi
            echo "attempt $attempt: HTTP $status, retrying in 10s"
            sleep 10
          done
          echo "site did not return 200 after the deploy"
          exit 1
