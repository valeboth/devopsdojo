name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same PR makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # `npm install`, not `npm ci`: npm/cli#4828 makes `ci` fail on optional
      # platform-specific deps that resolve differently on the runner.
      - run: npm install --no-audit --no-fund

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      - run: npm run build

      - name: Validate content/
        run: npm run content:validate

  e2e:
    name: E2E (iPhone SE + iPhone 14)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm install --no-audit --no-fund

      - run: npx playwright install --with-deps chromium webkit

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
